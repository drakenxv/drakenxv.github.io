/* Website-Vorlage v0.5 – erzeugt mit Website-Editor (Design über CI-Variablen) */
:root{--p:#006ec7;--a:#28dcaa;--tx:#1a1a1a;--bg:#fff;--sf:#f6f5f3;--ln:#e4e0dc;--mut:#6b6560;--pi:#fff;
  --font:system-ui,"Segoe UI",Arial,sans-serif;--hfont:var(--font);--r:6px;--logoH:36px;--maxw:1100px;--hdH:64px;--sideW:270px}
*{box-sizing:border-box}

.hd{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ln)}
.hd::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--p),var(--a))}

.sfil{margin-top:20px}
.fhide{display:none!important}
.lay-raster .sfil+.secs{margin-top:0}
.lay-raster .sec.fc{border-top:4px solid var(--sc)}
.stg{margin:-6px 0 12px}
.blk>summary .tags{flex:0 1 auto;justify-content:flex-end}
.sfnone{margin:16px 0}
/* Footer */
.ft{background:var(--sf);border-top:1px solid var(--ln)}
.ft-in{max-width:calc(var(--maxw) + 48px);margin:0 auto;padding:26px 24px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 32px;font-size:.9rem;color:var(--mut)}
.nav-left .ft-in{max-width:calc(var(--maxw) + var(--sideW) + 88px)}
.ftx{white-space:pre-line;flex:1;min-width:240px}
.ft a{color:var(--mut)}
/* Nach oben */
.totop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;border:0;background:var(--p);color:var(--pi);font-size:1.2rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.totop.on{opacity:1;pointer-events:auto}
/* Dialoge: Suche, Sitemap, Bild */
.dlg{border:0;border-radius:calc(var(--r) * 2);padding:0;width:min(720px,94vw);max-height:84vh;background:var(--bg);color:var(--tx);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dlg::backdrop{background:rgba(10,15,25,.5)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln)}
.dh h3{margin:0;flex:1;font-size:1.1rem}
.dx{border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--mut);line-height:1}
.db{padding:16px 18px;overflow:auto;max-height:calc(84vh - 64px)}
.srin{width:100%;padding:10px 14px;font:inherit;border:1px solid var(--ln);border-radius:var(--r);background:var(--bg);color:var(--tx);outline-color:var(--p)}
.srinfo{font-size:.85rem;color:var(--mut);margin:8px 2px}
.srr a{display:block;text-decoration:none;color:var(--tx);padding:10px 12px;border-radius:var(--r);border-bottom:1px solid var(--ln)}
.srr a:hover,.srr a.on{background:var(--sf)}
.srr small{display:block;color:var(--mut)}
.srr .sx{font-size:.88rem;color:var(--mut)}
.srr mark{background:color-mix(in srgb,var(--a) 45%,transparent);color:inherit;border-radius:2px}
.smk{margin:0 0 18px}
.smk>a{font-weight:700;text-decoration:none}
.smk ul{margin:4px 0 0;padding-left:20px}
.smk li{margin:2px 0}
.smk ul ul{font-size:.9rem}
.smk ul ul a{color:var(--mut)}
#lbDlg{background:transparent;box-shadow:none;width:auto;max-width:96vw;max-height:96vh;overflow:visible}
#lbDlg img{max-height:88vh;max-width:94vw;border-radius:var(--r);display:block}
#lbDlg p{color:#fff;text-align:center;margin:8px 0 0}
/* Entwürfe (nur Vorschau) */
.draft{outline:2px dashed #d9822b;outline-offset:4px;position:relative}
.draft::before{content:"Entwurf";position:absolute;top:-12px;right:10px;background:#d9822b;color:#fff;font:700 11px/1.5 system-ui,sans-serif;padding:0 8px;border-radius:99px;z-index:2}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
/* Mobil */
@media (max-width:900px){
  .mbtn{display:block}
  .tnav,.side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--bg);z-index:50;transform:translateX(-105%);transition:transform .2s;overflow:auto;padding:20px 16px;box-shadow:4px 0 30px rgba(0,0,0,.2);max-height:none;align-self:auto;height:auto}
  body.navopen .tnav,body.navopen .side{transform:none}
  body.navopen.nav-top .hd{z-index:60}
  body.navopen .scrim{display:block}
  .tnav>ul{flex-direction:column}
  .tnav>ul>li>a.on{box-shadow:inset 3px 0 0 var(--p);border-radius:0}
  .tnav .sub{display:block;position:static;box-shadow:none;border:0;padding:0 0 6px 14px;min-width:0}
  .shell.left{display:block}
  .lay-zweispaltig .secs,.tbx,.tbx.l{grid-template-columns:1fr}
  .tbx.l figure{order:0}
  .sbtn span{display:none}
  .herosec{padding:32px 22px}.herosec h2{font-size:1.7rem}
  .hd-in{padding:8px 16px;gap:12px}.shell{padding:0 16px}
  .brand small{display:none}
  .kh h1{font-size:1.6rem}
  .kfw.mitbox{grid-template-columns:1fr}.sz-breit .pbtn{flex-basis:100%}
  .kmap{grid-template-columns:1fr}.kml{height:auto!important;max-height:420px}.h-klein .kmm,.h-mittel .kmm,.h-gross .kmm{height:340px}
  .kd{min-height:64px}.kev{font-size:0;padding:0;height:6px;border-left:0;background:var(--ec)}
  .kbd{padding-left:14px}.knav .kt{min-width:120px}
}
@media print{.hd,.side,.ft,.totop,.toc,.pager,.fbar,.knav,.kv{display:none!important}.shell.left{display:block}.blk>.bb{display:block}}
</style>

/* Kalender: Monats- und Listenansicht */
function kalender(m, {k, s}){
  const cfg = s.kalender||{}, pid = k.id+'/'+s.id;
  const E = (s.eintraege||[]).filter(e=>e.datum).sort((a,b)=>(a.datum+(a.zeit||'')).localeCompare(b.datum+(b.zeit||'')));
  const st = {q:'', f:{}, past:!!cfg.vergangene, view: cfg.ansicht==='liste' || window.innerWidth<640 ? 'liste' : 'monat'};
  const nxt = E.find(e=>(e.ende||e.datum)>=TODAY);
  let cur = TODAY.slice(0,7);
  if(!E.some(e=>(e.ende||e.datum).slice(0,7)>=cur && e.datum.slice(0,7)<=cur) && nxt) cur = nxt.datum.slice(0,7);
  m.innerHTML = `<div class="kbar"><div class="kv" role="tablist"><button type="button" data-v="monat">${T.monat}</button><button type="button" data-v="liste">${T.liste}</button></div>
    <div class="knav"><button type="button" data-m="-1" aria-label="zurück">‹</button><b class="kt"></b><button type="button" data-m="1" aria-label="weiter">›</button><button type="button" data-m="0">${T.heute}</button></div></div>
    ${fbar(s, `<label class="fpl"><input type="checkbox" class="fpast" ${st.past?'checked':''}> ${T.past}</label>`)}<div class="kbody"></div>`;
  const body = $('.kbody', m);
  function render(){
    const list = E.filter(e=>fmatch(s, st, e));
    $$('.kv button', m).forEach(b=>b.classList.toggle('on', b.dataset.v===st.view));
    $('.knav', m).style.display = st.view==='monat' ? '' : 'none';
    $('.fpl', m).style.display = st.view==='liste' ? '' : 'none';
    if(st.view==='monat'){
      const [y, mo] = cur.split('-').map(Number), first = new Date(y, mo-1, 1), off = (first.getDay()+6)%7;
      $('.kt', m).textContent = first.toLocaleDateString(LOC, {month:'long', year:'numeric'});
      const start = new Date(y, mo-1, 1-off), weeks = Math.ceil((off + new Date(y, mo, 0).getDate())/7);
      const wd = [...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC,{weekday:'short'}));
      let h = `<div class="kgrid">${wd.map(w=>`<div class="kwd">${esc(w)}</div>`).join('')}`, n = 0;
      for(let i=0; i<weeks*7; i++){
        const d = new Date(start); d.setDate(start.getDate()+i); const iso = isoOf(d);
        const ev = list.filter(e=>e.datum<=iso && (e.ende||e.datum)>=iso); if(d.getMonth()===mo-1) n += ev.filter(e=>e.datum===iso || iso.endsWith('-01')).length;
        h += `<div class="kd ${d.getMonth()!==mo-1?'o':''} ${iso===TODAY?'td':''}"><span class="kn">${d.getDate()}</span>${ev.map(e=>`<button type="button" class="kev${drc(e)}" data-e="${esc(e.id)}" style="--ec:${esc(colorOf(s,e)||'var(--p)')}" title="${esc(e.titel)}">${e.zeit&&e.datum===iso?`<small>${esc(e.zeit.split(/[–-]/)[0].trim())}</small> `:''}${esc(e.titel)}</button>`).join('')}</div>`;
      }
      body.innerHTML = h+'</div>';
      $('.fcnt', m).textContent = list.filter(e=>e.datum.slice(0,7)<=cur && (e.ende||e.datum).slice(0,7)>=cur).length+' '+T.von+' '+E.length;
    } else {
      const L2 = list.filter(e=>st.past || (e.ende||e.datum)>=TODAY);
      $('.fcnt', m).textContent = L2.length+' '+T.von+' '+E.length;
      let h = '', last = '';
      L2.forEach(e=>{
        const mk = e.datum.slice(0,7); if(mk!==last){ h += `<h4 class="km">${esc(dt(e.datum).toLocaleDateString(LOC,{month:'long', year:'numeric'}))}</h4>`; last = mk; }
        h += `<details class="kle${drc(e)} ${(e.ende||e.datum)<TODAY?'past':''}" data-e="${esc(e.id)}" style="--ec:${esc(colorOf(s,e)||'var(--p)')}"><summary><span class="kdt"><b>${dt(e.datum).getDate()}</b><small>${esc(dfmt(e.datum,{month:'short'}))}</small></span>
          <span class="kli"><b>${esc(e.titel)}</b><small>${esc([range(e), e.zeit, e.ort].filter(Boolean).join(' · '))}</small><span class="tags">${tagsOf(s,e)}</span></span></summary>
          <div class="kbd"><div class="rt">${e.text||''}</div>${linkBtn(e)?`<div class="btns">${linkBtn(e)}</div>`:''}</div></details>`;
      });
      body.innerHTML = h || `<p class="empty">${T.keine}</p>`;
    }
  }
  bindBar(m, st, render);
  $('.kv', m).addEventListener('click', e=>{ const b=e.target.closest('[data-v]'); if(b){ st.view=b.dataset.v; render(); } });
  $('.knav', m).addEventListener('click', e=>{ const b=e.target.closest('[data-m]'); if(!b) return; const d=+b.dataset.m;
    if(!d) cur = TODAY.slice(0,7); else { const [y,mo]=cur.split('-').map(Number), n=new Date(y, mo-1+d, 1); cur = isoOf(n).slice(0,7); } render(); });
  body.addEventListener('click', e=>{ const b=e.target.closest('.kev'); if(b){ const x=E.find(z=>z.id===b.dataset.e); if(x) entryDlg(s, x); } });
  render();
  return {open(id){ const e=E.find(z=>z.id===id); if(!e) return false;
    if(st.view==='monat'){ cur = e.datum.slice(0,7); render(); entryDlg(s, e); }
    else { if((e.ende||e.datum)<TODAY && !st.past){ st.past=true; $('.fpast',m).checked=true; render(); } const d=$(`.kle[data-e="${CSS.escape(id)}"]`, m); if(d){ d.open=true; d.scrollIntoView({block:'center'}); } }
    return true; }};
}

/* Karte: Leaflet (OpenStreetMap) wird nur bei Bedarf aus dem Internet geladen */
let LEAF = null;
function loadLeaflet(){
  if(window.L && window.L.map) return Promise.resolve(window.L);
  if(LEAF) return LEAF;
  const SRC = [['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'],
               ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js']];
  const one = ([css, js])=>new Promise((res, rej)=>{
    const c = document.createElement('link'); c.rel='stylesheet'; c.href=css; document.head.appendChild(c);
    const j = document.createElement('script'); j.src=js; j.onload = ()=>window.L ? res(window.L) : rej(); j.onerror = ()=>{ c.remove(); j.remove(); rej(); }; document.head.appendChild(j);
    setTimeout(rej, 8000);
  });
  LEAF = one(SRC[0]).catch(()=>one(SRC[1]));
  return LEAF;
}
const hasPos = e=>e.lat!=='' && e.lat!=null && e.lng!=='' && e.lng!=null && isFinite(+e.lat) && isFinite(+e.lng);
function karte(m, {k, s}){
  const cfg = s.karte||{}, E = (s.eintraege||[]).slice().sort((a,b)=>String(a.titel).localeCompare(String(b.titel), LOC));
  const st = {q:'', f:{}}; let map = null, layer = null, marks = {}, pending = null, list = E;
  m.innerHTML = `${fbar(s)}<div class="kmap h-${esc(cfg.hoehe||'mittel')} ${cfg.ohneListe?'nol':''}"><div class="kmm"><p class="empty kmw">…</p></div><div class="kml"></div></div>`;
  const mm = $('.kmm', m), ml = $('.kml', m);
  function render(){
    list = E.filter(e=>fmatch(s, st, e));
    $('.fcnt', m).textContent = list.length+' '+T.von+' '+E.length;
    ml.innerHTML = list.map(e=>`<button type="button" class="kmi${drc(e)}" data-e="${esc(e.id)}" style="--ec:${esc(colorOf(s,e)||'var(--p)')}"><span class="kdot"></span><span><b>${esc(e.titel)}</b><small>${esc([e.ort, e.adresse].filter(Boolean).join(' · ') || (hasPos(e)?'':T.nokoord))}</small><span class="tags">${tagsOf(s,e)}</span></span></button>`).join('') || `<p class="empty">${T.keine}</p>`;
    if(!map) return;
    layer.clearLayers(); marks = {};
    const pts = [];
    list.filter(hasPos).forEach(e=>{
      const mk = window.L.circleMarker([+e.lat, +e.lng], {radius:9, weight:2, color:'#fff', fillColor:colorOf(s,e)||getComputedStyle(root).getPropertyValue('--p').trim()||'#006ec7', fillOpacity:.95})
        .bindPopup(`<b>${esc(e.titel)}</b>${e.ort||e.adresse?`<br><small>${esc([e.ort,e.adresse].filter(Boolean).join(', '))}</small>`:''}${strip(e.text)?`<p>${esc(strip(e.text).slice(0,160))}${strip(e.text).length>160?' …':''}</p>`:''}<p><a href="#${esc(pid)}/${esc(e.id)}" data-det="${esc(e.id)}">Details</a>${e.link?` · <a href="${esc(e.link)}"${ext(e.link)}>${esc(e.linkText||T.mehr)}</a>`:''}</p>`);
      mk.addTo(layer); marks[e.id] = mk; pts.push([+e.lat, +e.lng]);
    });
    if(pts.length===1) map.setView(pts[0], 12); else if(pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom:12});
  }
  const pid = k.id+'/'+s.id;
  function focus(id, det){
    const e = E.find(z=>z.id===id); if(!e) return false;
    $$('.kmi', ml).forEach(b=>b.classList.toggle('on', b.dataset.e===id));
    if(map && marks[id]){ map.setView(marks[id].getLatLng(), Math.max(map.getZoom(), 12)); marks[id].openPopup(); }
    if(det || !map || !marks[id]) entryDlg(s, e);
    return true;
  }
  bindBar(m, st, render);
  ml.addEventListener('click', e=>{ const b=e.target.closest('.kmi'); if(b) focus(b.dataset.e); });
  m.addEventListener('click', e=>{ const a=e.target.closest('[data-det]'); if(a){ e.preventDefault(); e.stopPropagation(); const x=E.find(z=>z.id===a.dataset.det); if(x) entryDlg(s,x); } }, true);
  render();
  loadLeaflet().then(L=>{
    mm.innerHTML = ''; map = L.map(mm, {scrollWheelZoom:false}).setView([51.2, 10.4], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(map);
    layer = L.layerGroup().addTo(map); render(); setTimeout(()=>map.invalidateSize(), 50);
    if(pending){ focus(pending); pending = null; }
  }).catch(()=>{ mm.innerHTML = `<p class="empty kmw">${T.offline}</p>`; });
  return {open(id){ if(!E.some(z=>z.id===id)) return false; m.scrollIntoView({block:'start'}); if(map) focus(id); else { pending = id; focus(id); } return true; }};
}

/* ---------- Navigation / Routing ---------- */
function setActive(h){
  const [k,s] = h.split('/');
  $$('.nav a.on').forEach(a=>a.classList.remove('on'));
  if(k) $$(`.nav a[href="#${k}"]`).forEach(a=>a.classList.add('on'));

function openTo(t){ if(t.classList.contains('fhide')){ const fb=t.parentElement.previousElementSibling; const r=fb&&fb.querySelector('.freset'); if(r) r.click(); } for(let d=t; d; d=d.parentElement) if(d.tagName==='DETAILS') d.open = true; }
function closeAll(){ document.body.classList.remove('navopen'); ['srDlg','smDlg','lbDlg','evDlg'].forEach(id=>{ const d=document.getElementById(id); if(d && d.open) d.close(); }); }
function route(h, smooth){
  h = decodeURIComponent(h||'').replace(/^#/,'');
  if(h==='sitemap'){ openSitemap(); return; }
  closeAll();
  if(MODE==='cont'){
    const t = h && document.getElementById(h), p = h.split('/');
    if(t){ openTo(t); t.scrollIntoView({behavior:smooth?'smooth':'auto'}); }
    else if(p.length===3 && MOD[p[0]+'/'+p[1]] && MOD[p[0]+'/'+p[1]].open(p[2])){ h = p[0]+'/'+p[1]; }
    else window.scrollTo(0,0);
    setActive(h); return;
  }
  let [ki, si] = (h||HOME).split('/'), k = K.find(x=>x.id===ki);
  if(!k){ [ki,si] = HOME.split('/'); k = K.find(x=>x.id===ki); h = HOME; }
  if(!k){ main.innerHTML = '<p class="empty">Noch keine Inhalte.</p>'; return; }
  const s = si && k.seiten.find(x=>x.id===si);
  if(s && k.seiten.length>1) showPage(k, s); else showKap(k);
  const t = h.split('/').length>2 && document.getElementById(h);
  const ent = !t && s && h.split('/').length===3 && MOD[k.id+'/'+s.id];
  if(t){ openTo(t); setTimeout(()=>t.scrollIntoView({behavior:smooth?'smooth':'auto'}), 20); }
  else { window.scrollTo(0,0); if(ent) setTimeout(()=>ent.open(h.split('/')[2]), 30); }
  setActive(s && k.seiten.length>1 ? k.id+'/'+s.id : k.id);
}

/* ---------- Sitemap ---------- */
function openSitemap(){
  $('#smBody').innerHTML = K.map(k=>`<div class="smk"><a href="#${k.id}">${esc(k.titel)}</a>${k.seiten.length?`<ul>${k.seiten.map(s=>`<li><a href="#${k.id}/${s.id}">${esc(s.titel)}</a>${s.abschnitte.filter(a=>!a.titelAusblenden).length?`<ul>${s.abschnitte.filter(a=>!a.titelAusblenden).map(a=>`<li><a href="#${k.id}/${s.id}/${a.id}">${esc(a.titel)}</a></li>`).join('')}</ul>`:''}</li>`).join('')}</ul>`:''}</div>`).join('');
  document.body.classList.remove('navopen');
  if(!$('#smDlg').open) $('#smDlg').showModal();
}

/* ---------- Suche ---------- */
const IDX = [];
function elText(e){ const out=[]; const w=v=>{ if(typeof v==='string') out.push(v); else if(Array.isArray(v)) v.forEach(w); else if(v&&typeof v==='object') Object.keys(v).forEach(k=>{ if(!['src','typ','link','href','stil','art','breite'].includes(k)) w(v[k]); }); }; w(e); return strip(out.join(' ').replace(/</g,' <')); }
K.forEach(k=>{
  IDX.push({h:k.id, t:k.titel, c:'Kapitel', x:[strip(k.einleitung), ...k.elemente.map(elText)].join(' ')});
  k.seiten.forEach(s=>{
    IDX.push({h:k.id+'/'+s.id, t:s.titel, c:k.titel, x:strip(s.einleitung)});
    s.abschnitte.forEach(a=>IDX.push({h:k.id+'/'+s.id+'/'+a.id, t:a.titel, c:k.titel+' › '+s.titel, x:[(a.elemente||[]).filter(vis).map(elText).join(' '), (s.filter||[]).map(f=>((a.werte||{})[f.id]||[]).map(v=>(optOf(s,f.id,v)||{}).name).join(' ')).join(' ')].join(' ')}));
    if(s.layout==='kalender'||s.layout==='karte') (s.eintraege||[]).forEach(e=>IDX.push({h:k.id+'/'+s.id+'/'+e.id, t:e.titel, c:k.titel+' › '+s.titel, x:[range(e), e.zeit, e.ort, e.adresse, strip(e.text), (s.filter||[]).map(f=>((e.werte||{})[f.id]||[]).map(v=>(optOf(s,f.id,v)||{}).name).join(' ')).join(' ')].filter(Boolean).join(' · ')}));
  });
});
function hl(t, terms){ let s=esc(t); terms.forEach(q=>{ s=s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }); return s; }
function search(){
  const q = $('#srIn').value.trim().toLowerCase(), terms = q.split(/\s+/).filter(Boolean);
  if(!terms.length){ $('#srRes').innerHTML=''; $('#srInfo').textContent=''; return; }
  const res = IDX.map(e=>{ const T=(e.t||'').toLowerCase(), X=(e.x||'').toLowerCase();
    if(!terms.every(t=>T.includes(t)||X.includes(t))) return null;
    return {e, sc:terms.reduce((n,t)=>n+(T.includes(t)?10:0)+(X.split(t).length-1),0)}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,50);
  $('#srInfo').textContent = res.length ? res.length+' Treffer' : 'Keine Treffer';
  $('#srRes').innerHTML = res.map(({e},i)=>{
    const X=e.x||'', p=X.toLowerCase().indexOf(terms[0]), sn = p<0 ? X.slice(0,140) : (p>60?'… ':'')+X.slice(Math.max(0,p-60), p+100)+(X.length>p+100?' …':'');
    return `<a href="#${e.h}" class="${i?'':'on'}"><small>${esc(e.c)}</small><b>${hl(e.t,terms)}</b>${sn?`<div class="sx">${hl(sn,terms)}</div>`:''}</a>`; }).join('');
}
function openSearch(){ if(!M.suche) return; document.body.classList.remove('navopen'); $('#srDlg').showModal(); $('#srIn').select(); search(); }
if(M.suche){
  $('#sbtn').addEventListener('click', openSearch);
  $('#srIn').addEventListener('input', search);
  $('#srIn').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const a=$('#srRes a'); if(a){ e.preventDefault(); go(a.getAttribute('href').slice(1)); } } });
  document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); } });
}

/* Start */
route(window.PREVIEW_HASH != null ? window.PREVIEW_HASH : location.hash, false);
})();
</script>
